[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ems"
version = "0.1.0"
description = "Linear multi-carrier dispatch model (energy management system) for industrial-site electrification studies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyomo>=6.7,<7",
    "highspy>=1.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
oems-app = "oems.ui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oems.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running performance tests (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
